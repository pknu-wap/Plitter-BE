spring.application.name=plitter-be
spring.config.import=secret-application.properties
spring.cors.allowed_origins=http://localhost:5173,https://plitter-fe.vercel.app
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

lastfm.base-url=https://ws.audioscrobbler.com/2.0/

# Names and two creative tags are generated together; genre tags are supplied by the server.
character.generation.llm-metadata-enabled=${CHARACTER_LLM_METADATA_ENABLED:true}
character.openai.metadata.model=${CHARACTER_METADATA_MODEL:gpt-6-luna}
character.openai.metadata.timeout-millis=${CHARACTER_METADATA_TIMEOUT_MILLIS:5000}
